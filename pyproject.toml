[project]
name = "retrolog"
version = "0.2.1"
description = "Turn a folder of old .txt, .doc and .docx media lists into files Letterboxd can import"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
# Two runtime packages, each pinned to one exact release: python-docx, which reads .docx
# bodies, and lxml, which python-docx is built on and which the survey also imports
# directly, to read the raw WordprocessingML python-docx's API does not expose. The
# licenses were read from the package metadata when pinned: python-docx MIT, lxml
# BSD-3-Clause. A license can change between versions, so re-read it on every bump.
# Everything else is standard-library only, the HTTP lookups included.
dependencies = ["python-docx==1.2.0", "lxml==6.1.2"]

[project.optional-dependencies]
# Everything the suites need. hypothesis drives the property tests and nothing at runtime
# imports it. python-docx and lxml are repeated here, exactly, because the survey and parse
# suites build and read .docx files with them, and a check that installs this extra's
# requirement strings on their own, before the project itself, would otherwise run them
# without either.
test = ["hypothesis==6.165.10", "python-docx==1.2.0", "lxml==6.1.2"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9/F are ruff's classic default set, written out so the enabled rules are a
# function of this file rather than of whichever ruff release is installed. PGH003/PGH004
# require every suppression to carry a rule code. D adds the docstring rules (pep257),
# minus D401's imperative-mood opinion, which rewords valid noun-phrase summaries.
select = ["E4", "E7", "E9", "F", "PGH003", "PGH004", "D"]
ignore = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test method names self-document; a docstring per test would be noise.
"**/test_*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
# Every entry covers the same blind spot: an import that resolves at RUNTIME through a
# sys.path insert mypy cannot see. Each tool puts the bootstrap folder on sys.path, the
# bootstrap puts the shared libraries there, and each CLI and suite puts its own and its
# siblings' src/ there.
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/retrolog_bootstrap",
  "$MYPY_CONFIG_FILE_DIR/stdio_utf8",
  "$MYPY_CONFIG_FILE_DIR/help_formatter",
  "$MYPY_CONFIG_FILE_DIR/bounded_fetch",
  # bounded_run puts its private src/ on sys.path at load time.
  "$MYPY_CONFIG_FILE_DIR/bounded_run",
  "$MYPY_CONFIG_FILE_DIR/bounded_run/src",
  "$MYPY_CONFIG_FILE_DIR/live_pid_guard",
  "$MYPY_CONFIG_FILE_DIR/retrolog_survey/src",
  "$MYPY_CONFIG_FILE_DIR/retrolog_parse/src",
  "$MYPY_CONFIG_FILE_DIR/retrolog_resolve/src",
  "$MYPY_CONFIG_FILE_DIR/retrolog_export/src",
  "$MYPY_CONFIG_FILE_DIR/retrolog_review/src",
  "$MYPY_CONFIG_FILE_DIR/retrolog_restore/src",
  "$MYPY_CONFIG_FILE_DIR/retrolog_probe/src",
  # Each tool's sample builder, which that tool's CLI tests import to check the committed
  # sample. The samples/ folders are not type-checked on their own, so each builder is
  # checked through that import. Each builder has its own name, so no two share a module
  # name.
  "$MYPY_CONFIG_FILE_DIR/retrolog_survey/samples",
  "$MYPY_CONFIG_FILE_DIR/retrolog_parse/samples",
  "$MYPY_CONFIG_FILE_DIR/retrolog_resolve/samples",
  "$MYPY_CONFIG_FILE_DIR/retrolog_export/samples",
  "$MYPY_CONFIG_FILE_DIR/retrolog_review/samples",
  "$MYPY_CONFIG_FILE_DIR/retrolog_restore/samples",
  "$MYPY_CONFIG_FILE_DIR/retrolog_probe/samples",
]

# lxml ships no type stubs and no py.typed. survey_docx reads python-docx's raw
# WordprocessingML through it (python-docx's own API does not expose w:sym), so the import
# is real; scoped to lxml alone, since python-docx ships py.typed and is checked.
[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

# --- The test-results cache's environment list. ---
#
# retrolog_resolve/tests/test_env_declared.py reads this table: it fails when the list
# and the variables the tools read, by literal or module-level constant, differ.

[tool.gate_cache]
# The variables whose value changes which tests run, so a verdict recorded with one setting
# is never replayed into a run with another. RETROLOG_RESOLVE_OFFLINE skips
# retrolog_resolve's and retrolog_probe's live tests, and RETROLOG_TMDB_TOKEN skips the
# TMDb one when absent.
# RETROLOG_CONTACT is read only by retrolog_resolve's CLI, which every test isolates; it is
# listed so the list stays exactly the project's reads.
env = [
  "RETROLOG_CONTACT",
  "RETROLOG_RESOLVE_OFFLINE",
  "RETROLOG_TMDB_TOKEN",
]
