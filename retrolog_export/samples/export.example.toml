# An example export config for retrolog_export. Keep yours next to your notes, never in
# a repository: a real one names rating codes and a title from your own lists. Every
# title, key, word, and tag below is a made-up example.
#
# An unknown key, a missing one, or a value of the wrong shape stops the run before
# anything is written, with a message naming the key and never its value.

# The layout version of this file. Only 1 exists.
schema = 1

# How films are written for Letterboxd's importer. A file with no [letterboxd] table
# configures no Letterboxd export.
[letterboxd]
# Write each dated row's date as its WatchedDate (true), or leave the column empty
# (false), so the import screen can make diary entries or just mark films watched.
watched_date = true
# Tags added to every exported row, at least one: the next run knows a film an import
# sent by its tag, so [] stops the run. Each is 1 to 50 characters with no comma,
# quote, or control character, and starts with "retrolog", so none can collide with a
# tag the account already uses and the import can be found from its tag pages; any
# other tag stops the run.
tags = ["retrolog"]
# A note added to the Review column, above the row's comment. It may hold {year} and
# {date}, the watch's year and ISO date ({{ and }} for literal braces), and at most
# 500 characters; an undated row leaves out a note naming either. "" adds no note.
review_note = "Retrolog review. Original watch: {year}."
# Optional: a sentence added after the note, on a rated row only, so an unrated row
# keeps its note. It may hold {rating}, the word [letterboxd.rating_names] gives the
# row's rating key, and at most 500 characters. "" or leaving it out adds none.
review_note_rating = "Original rating: {rating}."
# Which rows the note and its sentence go on: "commented" (rows with a comment) or
# "all".
review_note_rows = "commented"

# Each rating key a row can carry, as the parse rules give it, mapped to stars from
# 0.5 to 5 in halves. A split code's key is both keys joined by "/", and may share its
# stars with another key, as "b/c" shares "b"'s here. A row rated with a key missing
# here stops the run; an unrated row is exported with no rating.
[letterboxd.ratings]
"a" = 1.5
"b" = 3
"c" = 4
"b/c" = 3

# Optional: a tag added to the rows of each rating key named here, which must also be
# in [letterboxd.ratings], and which starts with "retrolog" like every tag. A key left
# out adds no tag. It keeps the verdict the lists gave when the star mapping cannot,
# such as a split code sharing its stars with another key, or a film rerated later.
[letterboxd.rating_tags]
"a" = "retrolog-low"
"c" = "retrolog-high"
"b/c" = "retrolog-mid-high"

# Optional: the word review_note_rating prints for each rating key, 1 to 50 characters,
# each key also in [letterboxd.ratings]. A sentence naming {rating} needs a word for
# every key there.
[letterboxd.rating_names]
"a" = "low"
"b" = "mid"
"c" = "high"
"b/c" = "mid/high"

# Optional: the source row from which nothing is exported, because the account already
# holds it and every later one. It names the list file, its line, and the title on that
# line (matched ignoring case, spacing, and punctuation). Leave the table out to export
# every row.
[letterboxd.cutoff]
file = "2019/films.txt"
line = 12
title = "Placeholder Film Nine"

# Optional: films never sent, one [[letterboxd.omit]] table each, such as a film the
# import preview showed Letterboxd lacks. Each names a film by the title on its list
# line (matched ignoring case, spacing, and punctuation) and its year; leave out "year"
# for a film with no year. Every row of a film one entry names is left out and listed
# "omitted" in review.md. An entry naming no row, a title with no letter or digit, or a
# second entry for the same film stops the run, naming the entry by its number.
[[letterboxd.omit]]
title = "Placeholder Film Seven"
year = 1960

# How books are written for Goodreads' importer. A file with no [goodreads] table
# configures no Goodreads export; a file may hold it, [letterboxd], or both.
[goodreads]
# Shelves written to every exported book's Bookshelves, at least one. Each is 1 to 50
# lowercase letters, digits, hyphens, or underscores (no comma, space, or capital) and
# starts with "retrolog", so one shelf finds or undoes the import; any other shelf
# stops the run.
shelves = ["retrolog"]
# The Date Added an undated row gets, a date such as 1900-01-01 (no quotes), so an
# undated book sorts below every dated one; its Date Read stays blank. A dated row's
# Date Added is its read date. Leave it out only when no row is undated: an undated
# row with none stops the run.
undated_date_added = 1900-01-01
# Optional: a note written to Private Notes on every row. It may hold {year} and
# {date}, the read's year and ISO date ({{ and }} for literal braces), and at most 500
# characters; an undated row leaves out a note naming either. "" or leaving it out
# adds none. The row's comment goes to My Review, never here.
private_note = "Example import. Read {year}."
# Optional: a sentence added after the note, on a rated row only. It may hold
# {rating}, the word [goodreads.rating_names] gives the row's rating key.
private_note_rating = "Lists said: {rating}."
# Optional: a sentence added last, on a book read more than once. Such a book is one
# row, its newest read's date and rating; {years} is the earlier reads' years, oldest
# first, joined by ", ".
private_note_earlier = "Earlier reads: {years}."

# Each rating key a row can carry mapped to stars from 0.5 to 5 in halves, as for
# [letterboxd.ratings]. Goodreads keeps a half star. A row rated with a key missing
# here stops the run; an unrated row is exported with no rating.
[goodreads.ratings]
"a" = 1
"b" = 2.5
"c" = 3.5
"d" = 5

# Optional: the word private_note_rating prints for each rating key, 1 to 50
# characters, each key also in [goodreads.ratings]. A sentence naming {rating} needs a
# word for every key there.
[goodreads.rating_names]
"a" = "poor"
"b" = "fair"
"c" = "good"
"d" = "great"

# Optional: a tag shelf for each account shelf a book can already be on. A book sent
# although the library export has it on a shelf other than read, with no rating and
# no read count (to-read, or a custom shelf), is listed "remove-first" in review.md:
# remove it from Goodreads before the import, so it arrives as a new book. Its row
# also gets the tag named here for its old shelf, which keeps that grouping; a shelf
# with no entry adds none. Each name is a shelf name as above, but a tag needs no
# "retrolog" prefix: it keeps the account's own grouping.
[goodreads.shelf_tags]
"custom-shelf" = "custom-shelf-read"

# Optional: the source row from which no book is exported, as [letterboxd.cutoff].
[goodreads.cutoff]
file = "2019/books.txt"
line = 4
title = "Placeholder Book Eight"

# Optional: books never sent, one [[goodreads.omit]] table each, named by title and
# year as [[letterboxd.omit]] names a film, and listed "omitted" in review.md.
[[goodreads.omit]]
title = "Placeholder Book Nine"
year = 1955
